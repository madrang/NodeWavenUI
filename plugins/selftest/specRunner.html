<!doctype html>
<!--
  The specRunner page of the selftest plugin: Jasmine runs the DOM specs of the app
  inside the real app engine. Open it in a child window with the window tools,
  attach a session, and read the summary through the nodewavenSelftest page global.
-->
<html lang="en" data-theme="dark-gray">
<head>
  <meta charset="utf-8">
  <title>NodeWavenUI Self Test</title>
  <!-- The default built-in theme boots the page with the app palette, the way the app windows boot. -->
  <link rel="stylesheet" href="app://renderer/themes/dark-gray.css">
  <link rel="stylesheet" href="vendor/jasmine.css">
  <style>
    body { margin: 12px; font: 13px/1.45 system-ui, sans-serif; background: var(--bg); color: var(--text); }
    #selftest-summary { margin-bottom: 12px; font-weight: 600; }
    #selftest-summary.failed { color: var(--error); }
    #selftest-summary.passed { color: var(--chart-2); }
    #selftest-results { list-style: none; margin: 0; padding: 0; }
    .selftest-spec { padding: 3px 0; border-bottom: 1px solid var(--border); }
    .selftest-spec-name { font-weight: 500; }
    .selftest-spec.failed .selftest-spec-name { color: var(--error); }
    .selftest-spec-message { margin: 4px 0 0 18px; color: var(--muted); white-space: pre-wrap; }
  </style>
</head>
<body>
  <p id="selftest-summary">running…</p>
  <ul id="selftest-results"></ul>
  <script src="vendor/jasmine.js"></script>
  <script src="specs/selftest.spec.js"></script>
  <script src="boot.js"></script>
</body>
</html>
