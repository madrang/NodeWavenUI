<!doctype html>
<!-- NodeWavenUI workspace window: the main app screen. The launcher opens this page and hands it the workspace startup payload. -->
<html lang="en" data-theme="dark-gray">
<head>
  <meta charset="utf-8">
  <title>NodeWavenUI</title>
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="workspace.css">
  <!-- The shared text stack styles the markdown replies, the code tokens, and the diff lines. -->
  <link rel="stylesheet" href="text/styles.css">
  <!-- The default theme boots the page. theme.js discovers every theme, built-in and user-added, and injects the rest. -->
  <link rel="stylesheet" href="themes/dark-gray.css">
  <!-- Prism highlights code. The grammar files register on the Prism global in dependency order. -->
  <script src="libs/prism/prism-core.js"></script>
  <script src="libs/prism/prism-markup.js"></script>
  <script src="libs/prism/prism-clike.js"></script>
  <script src="libs/prism/prism-javascript.js"></script>
  <script src="libs/prism/prism-typescript.js"></script>
  <script src="libs/prism/prism-css.js"></script>
  <script src="libs/prism/prism-json.js"></script>
  <script src="libs/prism/prism-markdown.js"></script>
  <script src="libs/prism/prism-bash.js"></script>
  <script type="module" src="main.js"></script>
</head>
<body>
  <section id="screen-main" class="screen" hidden>
    <header id="app-header">
      <span id="workspace-name" class="app-title"></span>
      <span class="header-spacer"></span>
      <button id="app-devtools" class="header-button" type="button" title="${header.devtools}">&gt;_</button>
      <button id="app-settings" class="header-button" type="button" title="${header.settings}">⚙</button>
      <button id="app-minimize" class="header-button" type="button" title="${header.minimize}">–</button>
      <button id="app-maximize" class="header-button" type="button" title="${header.maximize}">▢</button>
      <button id="app-close" class="header-button" type="button" title="${common.close}">×</button>
    </header>
    <div id="frames-layout">
      <div id="rail-left">
        <div class="rail-tabbar">
          <button class="rail-tab active" data-rail-tab="events" type="button" title="${rail.events}" aria-label="${rail.events}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
          <button class="rail-tab" data-rail-tab="files" type="button" title="${rail.files}" aria-label="${rail.files}"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg></button>
          <button class="rail-tab" data-rail-tab="tasks" type="button" title="${rail.tasks}" aria-label="${rail.tasks}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7l2 2 4-4M4 17l2 2 4-4M14 7h6M14 17h6"/></svg></button>
        </div>
        <div class="rail-body">
          <div class="rail-panel" data-rail-panel="events">
            <div class="rail-filters">
              <button class="rail-chip active" data-rail-filter="all" type="button">${rail.all}</button>
              <button class="rail-chip" data-rail-filter="pending" type="button">${rail.pending}</button>
              <button class="rail-chip" data-rail-filter="completed" type="button">${rail.completed}</button>
            </div>
            <div id="rail-event-list" class="rail-scroll"></div>
            <footer class="rail-foot">
              <span id="rail-event-count" class="rail-foot-note"></span>
              <span class="rail-spacer"></span>
              <button id="rail-event-clear" class="rail-link" type="button" title="${rail.clearTitle}">${rail.clear}</button>
            </footer>
          </div>
          <div class="rail-panel" data-rail-panel="files" hidden>
            <div id="rail-file-tree" class="rail-scroll"></div>
          </div>
          <div class="rail-panel" data-rail-panel="tasks" hidden>
            <div id="rail-task-list" class="rail-scroll"></div>
            <footer class="rail-foot">
              <span id="rail-task-count" class="rail-foot-note"></span>
              <span class="rail-spacer"></span>
              <button id="rail-task-open" class="rail-link" type="button" title="${rail.boardTitle}">${rail.board}</button>
            </footer>
          </div>
        </div>
      </div>
      <div id="rail-resizer" class="column-resizer" title="${rail.resizeTitle}"></div>
      <div id="frames-center">
        <header id="workarea-tabs" hidden></header>
        <div id="pane-settings" class="pane" hidden></div>
        <div id="workarea-empty">
          <div class="workarea-box">${workarea.empty}</div>
          <span class="workarea-note">${workarea.note}</span>
        </div>
      </div>
      <div id="chat-resizer" class="column-resizer" title="${chat.resizeTitle}"></div>
      <div id="chat-column"></div>
    </div>
  </section>
</body>
</html>
