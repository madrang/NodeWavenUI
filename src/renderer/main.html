<!doctype html>
<!-- NodeWavenUI workspace window: the main app screen. The launcher opens this page and hands it the workspace startup payload. -->
<html lang="en" data-theme="dark-gray">
<head>
  <meta charset="utf-8">
  <title>NodeWavenUI</title>
  <link rel="stylesheet" href="styles.css">
  <!-- The default theme boots the page. theme.js discovers every theme, built-in and user-added, and injects the rest. -->
  <link rel="stylesheet" href="themes/dark-gray.css">
  <script type="module" src="main.js"></script>
</head>
<body>
  <section id="screen-main" class="screen" hidden>
    <header id="tab-bar">
      <button id="tab-settings" class="tab active" type="button">Settings</button>
      <span id="chat-tabs">
        <span id="chat-tab-list"></span>
        <button id="new-chat" class="tab tab-icon" type="button" title="New chat">+</button>
      </span>
      <button id="app-minimize" class="tab tab-icon" type="button" title="Minimize">–</button>
      <button id="app-close" class="tab tab-icon" type="button" title="Close">×</button>
    </header>
    <div id="pane-settings" class="pane">
      <dl class="facts">
        <dt>Workspace</dt><dd id="workspace-name"></dd>
        <dt>Setting storage</dt><dd id="workspace-storage-mode"></dd>
      </dl>
      <label class="field">Theme
        <select id="theme-select"></select>
      </label>
      <label class="field">Window frame
        <select id="frame-mode-select"></select>
      </label>
      <p class="status">The window frame applies the next time the workspace window opens.</p>
      <fieldset class="field" id="mcp-host-section" hidden>
        <legend>MCP host</legend>
        <p id="mcp-host-endpoint" class="status"></p>
        <div class="token-row">
          <input id="mcp-host-token" type="text" readonly placeholder="Access token" autocomplete="off" spellcheck="false">
          <button id="mcp-token-show" type="button">Show</button>
          <button id="mcp-token-copy" type="button">Copy</button>
        </div>
      </fieldset>
      <fieldset class="field" id="mcp-endpoints-section">
        <legend>MCP tools</legend>
        <div id="mcp-endpoint-list"></div>
        <details id="mcp-endpoint-add" class="provider-add">
          <summary>Add an MCP endpoint</summary>
          <form id="mcp-endpoint-add-form">
            <label class="field">Label
              <input id="mcp-add-label" type="text" placeholder="vault" autocomplete="off">
            </label>
            <label class="field">Kind
              <select id="mcp-add-kind">
                <option value="http">HTTP endpoint</option>
                <option value="stdio">Local command (stdio)</option>
              </select>
            </label>
            <label class="field" id="mcp-add-url-field">URL
              <input id="mcp-add-url" type="text" placeholder="https://host/mcp" autocomplete="off" spellcheck="false">
            </label>
            <label class="field" id="mcp-add-token-field">Bearer token (optional)
              <input id="mcp-add-token" type="password" autocomplete="off">
            </label>
            <label class="field" id="mcp-add-command-field" hidden>Command
              <input id="mcp-add-command" type="text" placeholder="node server.js" autocomplete="off" spellcheck="false">
            </label>
            <label class="field">Mode
              <select id="mcp-add-mode">
                <option value="native">Native — tools join the chat agent</option>
                <option value="preloaded">Preloaded — connect, use through evaluate</option>
                <option value="none">None — connect on agent request</option>
                <option value="disabled">Disabled — hidden from the agent</option>
              </select>
            </label>
            <button type="submit" id="mcp-endpoint-add-submit" class="primary">Add endpoint</button>
          </form>
        </details>
        <p id="mcp-endpoint-status" class="status" hidden></p>
      </fieldset>
      <fieldset class="field" id="storage-share-section">
        <legend>Storage sharing</legend>
        <div id="storage-share-list"></div>
        <details id="storage-share-add" class="provider-add">
          <summary>Add a shared storage</summary>
          <form id="storage-share-add-form">
            <label class="field">Label
              <input id="storage-share-label" type="text" placeholder="Project files" autocomplete="off">
            </label>
            <label class="field">Kind
              <select id="storage-share-setup"></select>
            </label>
            <div id="storage-share-fields"></div>
            <label class="field">Chat agent access
              <select id="storage-share-access">
                <option value="none">Not shared</option>
                <option value="readonly">Read-only</option>
              </select>
            </label>
            <button type="submit" id="storage-share-add-submit" class="primary">Add storage</button>
          </form>
        </details>
        <p id="storage-share-status" class="status" hidden></p>
      </fieldset>
      <section id="provider-section">
        <h3>Provider</h3>
        <div id="provider-list"></div>
        <details id="provider-add" class="provider-add">
          <summary>Add a provider</summary>
          <form id="provider-add-form">
            <label class="field">Label
              <input id="provider-add-label" type="text" placeholder="Moonshot" autocomplete="off">
            </label>
            <label class="field">Endpoint base URL
              <input id="provider-add-url" type="text" placeholder="https://api.moonshot.ai/v1" autocomplete="off" spellcheck="false">
            </label>
            <label class="field">API key
              <input id="provider-add-key" type="password" autocomplete="off">
            </label>
            <button type="submit" id="provider-add-submit" class="primary" disabled>Add provider</button>
          </form>
        </details>
        <p id="provider-status" class="status" hidden></p>
      </section>
    </div>
    <div id="pane-chat" class="pane pane-chat" hidden>
      <ol id="chat-messages"></ol>
      <div id="permission-requests" hidden></div>
      <form id="chat-form">
        <input id="chat-input" type="text" placeholder="Message…" autocomplete="off">
        <button id="chat-send" type="submit" class="primary">Send</button>
      </form>
      <footer id="chat-status"></footer>
    </div>
  </section>
</body>
</html>
