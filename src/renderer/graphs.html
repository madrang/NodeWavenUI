<!doctype html>
<!-- NodeWavenUI Graphs window: an empty SVG surface that agents draw on through the nodewavenGraphs page global (see docs/graphs.md). -->
<html lang="en" data-theme="dark-gray">
<head>
  <meta charset="utf-8">
  <title>Graphs — NodeWavenUI</title>
  <!-- The default theme boots the page. theme.js discovers every theme, built-in and user-added, and injects the rest. -->
  <link rel="stylesheet" href="themes/dark-gray.css">
  <link rel="stylesheet" href="graphs.css">
  <script type="module" src="graphs.js"></script>
</head>
<body>
  <p id="graph-empty">No graph. An agent draws here through nodewavenGraphs.</p>
  <svg id="graph-root" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" preserveAspectRatio="xMidYMid meet"></svg>
</body>
</html>
