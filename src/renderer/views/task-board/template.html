<form class="task-board-create">
  <input class="task-create-title" type="text" placeholder="${tasks.createTitlePlaceholder}" required>
  <textarea class="task-create-brief" placeholder="${tasks.createBriefPlaceholder}"></textarea>
  <input class="task-create-goal" type="text" placeholder="${tasks.createGoalPlaceholder}">
  <button type="submit" class="task-board-button primary">${tasks.createSubmit}</button>
</form>
<div class="task-board-groups"></div>
