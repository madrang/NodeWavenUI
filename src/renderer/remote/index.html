<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NodeWavenUI remote</title>
  <!-- The default theme and the shared text stack join the page: the markdown replies, the code tokens, and the diff lines. -->
  <link rel="stylesheet" href="themes/dark-gray.css">
  <link rel="stylesheet" href="text/styles.css">
  <link rel="stylesheet" href="remote.css">
</head>
<body>
  <header><h1>NodeWavenUI</h1><span id="connection" class="status">offline</span></header>
  <main id="login" hidden>
    <h2>Pair with the workspace</h2>
    <p class="status">Scan the QR code, or paste the pairing token, or log in with the remote password.</p>
    <form id="login-form">
      <input id="login-token" type="text" placeholder="pairing token" autocomplete="off" spellcheck="false">
      <input id="login-password" type="password" placeholder="or remote password" autocomplete="current-password">
      <button type="submit">Connect</button>
    </form>
    <p id="login-status" class="status"></p>
  </main>
  <main id="remote" hidden>
    <nav>
      <button data-view="approvals" class="active">Approvals</button>
      <button data-view="patches">Patches</button>
      <button data-view="tasks">Tasks</button>
      <button data-view="chats">Chats</button>
    </nav>
    <section id="view-approvals"></section>
    <section id="view-patches" hidden></section>
    <section id="view-tasks" hidden></section>
    <section id="view-chats" hidden></section>
  </main>
  <!-- Prism highlights code. The grammar files register on the Prism global in dependency order. -->
  <script src="libs/prism/prism-core.js"></script>
  <script src="libs/prism/prism-markup.js"></script>
  <script src="libs/prism/prism-clike.js"></script>
  <script src="libs/prism/prism-javascript.js"></script>
  <script src="libs/prism/prism-typescript.js"></script>
  <script src="libs/prism/prism-css.js"></script>
  <script src="libs/prism/prism-json.js"></script>
  <script src="libs/prism/prism-markdown.js"></script>
  <script src="libs/prism/prism-bash.js"></script>
  <script type="module" src="remote.js"></script>
</body>
</html>
